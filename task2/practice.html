<html lang="en">
<head>

    <title>Document</title>

    <table border="2">

        <tr>
            <td>Watch</td>
            <td>Brown</td>
            <td>5000</td>
        </tr>
        <tr>

    <br><br>

    <br><br>

    <input type="month">
    <br><br>

    <input type="week">
    <br><br>

    <input type="color">
    <br><br>

    <input type="range">
    <br><br>

    <label>Search</label>
    <input type="search">
    <br><br>

</body>
</html>
